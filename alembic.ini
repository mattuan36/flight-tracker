# Alembic config.
#
# The database URL is deliberately not set here: migrations/env.py reads the
# app's own config (DATABASE_URL, or local SQLite), so `alembic upgrade head`
# always targets the same database the app uses.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
truncate_slug_length = 40
# sqlalchemy.url is set programmatically in migrations/env.py

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
