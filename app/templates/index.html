{% extends "base.html" %}

{% block title %}{{ app_name }}{% endblock %}

{% block content %}
  <section class="panel">
    <h1>{{ app_name }}</h1>
    <p class="muted">
      A small private flight price tracker. Set the price you would actually pay
      and get an email when the fare drops below it.
    </p>
    <p>Accounts are invite-only.</p>
    <p><a class="button" href="{{ url_for('auth.login') }}">Sign in</a></p>
  </section>
{% endblock %}
