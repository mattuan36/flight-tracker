[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Date ranges read better with an en dash; it is not a lookalike here.
allowed-confusables = ["–"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
filterwarnings = [
    # Flask-Login still calls datetime.utcnow(); nothing we can do from here.
    "ignore:datetime.datetime.utcnow:DeprecationWarning:flask_login.*",
    # WTForms 3.3 deprecates tuple choices; they still work, and 3.4 is pinned out.
    "ignore:Passing SelectField choices as tuples is deprecated:DeprecationWarning:wtforms.*",
]
